name: this_note
description: "此记 · ThisNote — 安静而强大的本地优先写作空间"
publish_to: 'none'
version: 2.0.0+7

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # editor engine
  flutter_quill: ^11.6.0

  # state / data
  provider: ^6.1.5+1
  path_provider: ^2.1.6
  path: ^1.9.1
  uuid: ^4.6.0
  crypto: ^3.0.8
  intl: any

  # desktop shell
  window_manager: ^0.5.2
  file_selector: ^1.1.0
  share_plus: ^13.3.1
  url_launcher: ^6.3.3

  # export / sync / ai
  pdf: ^3.13.1
  archive: ^4.5.2
  xml: ^7.1.0
  http: ^1.6.0

  # design
  lucide_icons_flutter: ^4.0.1

  # code blocks
  highlight: ^0.7.0
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# The upstream package force-bundles six unused variable-weight fonts.
dependency_overrides:
  lucide_icons_flutter:
    path: packages/lucide_icons_flutter
  # 上游 Windows 实现依赖 ATL；本地副本用 Win32 转换替代，普通 Build Tools 可编译。
  flutter_secure_storage_windows:
    path: packages/flutter_secure_storage_windows

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-Light.ttf
          weight: 300
        - asset: assets/fonts/NotoSansSC-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansSC-Bold.ttf
          weight: 700
    - family: NotoSerifSC
      fonts:
        - asset: assets/fonts/NotoSerifSC-Regular.otf
    - family: MaShanZheng
      fonts:
        - asset: assets/fonts/MaShanZheng-Regular.ttf
    - family: ZCOOLXiaoWei
      fonts:
        - asset: assets/fonts/ZCOOLXiaoWei-Regular.ttf
    - family: NotoSansSCLight
      fonts:
        - asset: assets/fonts/NotoSansSC-Light.ttf
    - family: WenKai
      fonts:
        - asset: assets/fonts/LXGWWenKai-Regular.ttf
    - family: SmileySans
      fonts:
        - asset: assets/fonts/SmileySans-Oblique.otf
    - family: SourceHanMono
      fonts:
        - asset: assets/fonts/SourceHanMonoSC-Regular.otf
