name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release --split-debug-info=build/symbols/windows
      - name: Zip Windows bundle
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath build/ThisNote-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: thisnote-windows
          path: app/build/ThisNote-Windows.zip

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: |
          flutter build apk --release \
            --target-platform android-arm64 \
            --split-debug-info=build/symbols/android \
            --obfuscate
      - uses: actions/upload-artifact@v4
        with:
          name: thisnote-android
          path: app/build/app/outputs/flutter-apk/app-release.apk

  release:
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Rename artifacts
        run: |
          mv artifacts/thisnote-android/app-release.apk artifacts/thisnote-android/ThisNote-Android-arm64.apk
          ls -R artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true